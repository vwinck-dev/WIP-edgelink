name: Laravel CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -uroot -proot; do
            echo "Waiting for MySQL..."
            sleep 2
          done      

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pcntl, curl, redis, pdo_mysql
          ini-values: post_max_size=256M, memory_limit=512M
          coverage: none

      - name: Copy .env
        working-directory: server-laravel-backend
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer dependencies
        working-directory: server-laravel-backend
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate APP_KEY
        working-directory: server-laravel-backend
        run: php artisan key:generate

      - name: Set Permissions
        working-directory: server-laravel-backend
        run: chmod -R 777 storage bootstrap/cache

      - name: Run Migrations
        working-directory: server-laravel-backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel
          DB_USERNAME: sail
          DB_PASSWORD: password
        run: php artisan migrate --force

      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Clean NPM cache
        working-directory: server-laravel-backend
        run: npm cache clean --force

      - name: Install NPM dependencies
        working-directory: server-laravel-backend
        run: npm ci

      - name: Build assets (Vite)
        working-directory: server-laravel-backend
        run: npm run build

      - name: Clear Config Cache
        working-directory: server-laravel-backend
        run: php artisan config:clear

      - name: Run Laravel Pint
        working-directory: server-laravel-backend
        run: vendor/bin/pint --test

      - name: Run Larastan
        working-directory: server-laravel-backend
        run: vendor/bin/phpstan analyse

      - name: Run Tests
        working-directory: server-laravel-backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel
          DB_USERNAME: sail
          DB_PASSWORD: password
        run: php artisan test